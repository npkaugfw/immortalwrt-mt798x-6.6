name: Build AX6000 110M Firmware
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git libssl-dev python3 rsync unzip wget zlib1g-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cp defconfig/mt7986-ax6000.config .config
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-110m-firmware
          path: bin/targets/mediatek/filogic/*.bin
