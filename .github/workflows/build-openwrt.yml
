name: Build ImmortalWrt 6.6 for AX6000
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'openwrt-24.10-6.6'
        type: choice
        options:
          - openwrt-24.10-6.6
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk gettext git libelf-dev libncurses5-dev libssl-dev python3 python3-distutils rsync subversion swig unzip wget zlib1g-dev
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Load config
        run: |
          cp defconfig/mt7986-ax6000.config .config
          make defconfig
      - name: Download sources
        run: make download -j$(nproc)
      - name: Build firmware
        run: make -j$(nproc) || make -j1 V=s
      - uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax6000-110m
          path: bin/targets/mediatek/filogic/*.bin
