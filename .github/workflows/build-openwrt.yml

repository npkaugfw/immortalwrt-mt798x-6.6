name: Build AX6000 110M
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential gawk git libssl-dev python3 rsync unzip wget zlib1g-dev
      - run: ./scripts/feeds update -a && ./scripts/feeds install -a
      - run: cp defconfig/mt7986-ax6000.config .config && make defconfig
      - run: make download -j$(nproc)
      - run: make -j$(nproc) || make -j1 V=s
      - uses: actions/upload-artifact@v4
        with:
          name: ax6000-110m-firmware
          path: bin/targets/mediatek/filogic/*.bin
